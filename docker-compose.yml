version: '3.9'

services:
  devos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devos
    ports:
      - '3000:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - 'com.devos.description=Personal developer dashboard'
      - 'com.devos.version=1.0.0'

networks:
  default:
    name: devos-network
