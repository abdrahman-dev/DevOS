<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />

    <title>DevOS — Personal Developer Dashboard</title>
    <meta name="description" content="DevOS is a local-first personal dashboard for developers. Track projects, monitor integrations, and stay in flow. No backend. No accounts." />
    <meta name="keywords" content="developer dashboard, project tracker, devtools, wakatime, github, vercel, openrouter, local-first" />
    <meta name="author" content="Abdrahman Walied" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://devos.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devos.app" />
    <meta property="og:title" content="DevOS — Personal Developer Dashboard" />
    <meta property="og:description" content="Track projects, monitor integrations, and stay in flow. Local-first. No backend. No accounts." />
    <meta property="og:image" content="https://devos.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevOS — Personal Developer Dashboard" />
    <meta name="twitter:description" content="Local-first developer dashboard. GitHub, WakaTime, Vercel, OpenRouter and more." />
    <meta name="twitter:image" content="https://devos.app/og-image.png" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DevOS",
      "description": "Personal developer command center. Local-first. No accounts.",
      "url": "https://devos.app",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "Abdrahman Walied"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
